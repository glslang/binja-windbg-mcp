# Updates arrive grouped and weekly: a runtime bump also needs a regenerated
# requirements.lock (see tools/check_requirements.py), so batching keeps that manual
# step to one pull request instead of one per package.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: pip
    directory: /
    # pyproject.toml is the only real input. requirements.txt is a flat list of transitive
    # pins for the Extension Manager and Dependabot has no resolver for it, so it rewrites
    # those pins one line at a time: that is how #8 moved pydantic-core off the pydantic
    # version that pins it. requirements.lock it cannot see at all. Both are regenerated by
    # `uv pip compile`, so let Dependabot propose the direct dependency and nothing else.
    exclude-paths:
      - requirements.txt
    schedule:
      interval: weekly
    groups:
      runtime:
        patterns: ["*"]
    commit-message:
      prefix: deps
