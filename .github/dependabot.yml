# Actions only. The runtime pins are recompiled by the Runtime dependencies workflow
# instead: Dependabot never sees requirements.lock, and it rewrites the flat
# requirements.txt one pin at a time with no resolver behind it, which can pin a package
# away from the parent that requires it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
